<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XA Magazzino PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{background:#0c0f14;color:white;font-family:Arial;padding:15px}
input,button,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:none}
button{background:#d1b06a;color:black;font-weight:bold}
.card{background:#1a1f2b;padding:10px;margin:8px 0;border-radius:10px}
h2{margin-top:20px}
</style>
</head>

<body>

<h1>XA Magazzino + Cassa</h1>

<!-- SCANNER -->
<div class="card">
<input id="barcode" placeholder="Barcode">
<button onclick="startScanner()">📷 Scanner</button>
<div id="reader"></div>
</div>

<!-- INSERIMENTO -->
<div class="card">
<input id="nome" placeholder="Nome prodotto">
<input id="prezzo" type="number" placeholder="Prezzo €">
<input id="qty" type="number" placeholder="Quantità">

<select id="stile">
<option>Seleziona stile BJCP</option>
<option>21A American IPA</option>
<option>18B American Pale Ale</option>
<option>25B Saison</option>
<option>26C Tripel</option>
<option>15A Irish Stout</option>
</select>

<input type="file" id="foto">

<button onclick="salva()">Salva prodotto</button>
</div>

<!-- MAGAZZINO -->
<h2>Magazzino</h2>
<div id="lista"></div>

<!-- CASSA -->
<h2>Cassa</h2>
<div class="card">
<button onclick="aggiungiCassa()">➕ Aggiungi da barcode</button>
<div id="cassa"></div>
<h3>Totale: € <span id="totale">0</span></h3>

<input id="pagato" type="number" placeholder="Contanti ricevuti">
<button onclick="calcolaResto()">Calcola resto</button>
<div id="resto"></div>

<button onclick="chiudiScontrino()">Chiudi vendita</button>
</div>

<!-- STATISTICHE -->
<h2>Statistiche</h2>
<div class="card">
Totale venduto: € <span id="incasso">0</span><br>
Pezzi venduti: <span id="pezzi">0</span>
</div>

<script>

let prodotti = JSON.parse(localStorage.getItem("prodotti")) || [];
let cassa = [];
let incasso = localStorage.getItem("incasso") || 0;
let pezzi = localStorage.getItem("pezzi") || 0;

function salva(){
let nome=document.getElementById("nome").value;
let prezzo=parseFloat(document.getElementById("prezzo").value);
let qty=parseInt(document.getElementById("qty").value);
let barcode=document.getElementById("barcode").value;

prodotti.push({nome,prezzo,qty,barcode});
localStorage.setItem("prodotti",JSON.stringify(prodotti));
mostra();
}

function mostra(){
let html="";
prodotti.forEach(p=>{
html+=`<div class="card">
${p.nome} €${p.prezzo} Qty:${p.qty}
</div>`;
});
document.getElementById("lista").innerHTML=html;
}

function aggiungiCassa(){
let code=document.getElementById("barcode").value;
let p=prodotti.find(x=>x.barcode==code);
if(!p)return alert("Non trovato");

cassa.push(p);
mostraCassa();
}

function mostraCassa(){
let tot=0;
let html="";
cassa.forEach(p=>{
tot+=p.prezzo;
html+=`${p.nome} €${p.prezzo}<br>`;
});
document.getElementById("cassa").innerHTML=html;
document.getElementById("totale").innerText=tot.toFixed(2);
}

function calcolaResto(){
let tot=parseFloat(document.getElementById("totale").innerText);
let pagato=parseFloat(document.getElementById("pagato").value);
document.getElementById("resto").innerText="Resto: €"+(pagato-tot).toFixed(2);
}

function chiudiScontrino(){
let tot=parseFloat(document.getElementById("totale").innerText);
incasso=parseFloat(incasso)+tot;
pezzi+=cassa.length;

localStorage.setItem("incasso",incasso);
localStorage.setItem("pezzi",pezzi);

cassa=[];
mostraCassa();
aggiornaStats();
}

function aggiornaStats(){
document.getElementById("incasso").innerText=incasso;
document.getElementById("pezzi").innerText=pezzi;
}

function startScanner(){
const scanner=new Html5Qrcode("reader");
scanner.start({facingMode:"environment"},{fps:10,qrbox:250},
(decodedText)=>{
document.getElementById("barcode").value=decodedText;
scanner.stop();
});
}

mostra();
aggiornaStats();

</script>

</body>
</html>
