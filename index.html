<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XA Magazzino PRO</title>

<style>
body{
  font-family:Arial;
  background:#0b0f1a;
  color:white;
  padding:10px;
}
input, textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
}
button{
  padding:10px;
  margin:5px;
  border-radius:10px;
  border:none;
  font-weight:bold;
}
.card{
  padding:15px;
  border-radius:20px;
  margin:10px 0;
  background:linear-gradient(135deg,#1b2735,#090a0f);
}
img{
  width:100%;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>🍺 XA Magazzino PRO</h2>

<h3>Inserimento</h3>

<input id="barcode" placeholder="Barcode o QR (opzionale)">
<input id="nome" placeholder="Nome birra">
<input id="birrificio" placeholder="Birrificio">
<input id="formato" placeholder="Formato">
<input id="prezzo" placeholder="Prezzo">

<textarea id="gusto" placeholder="Gusto"></textarea>

<input type="file" id="img">

<button onclick="salva()">💾 Salva</button>

<hr>

<h3>Magazzino</h3>
<div id="lista"></div>

<script>
let db = JSON.parse(localStorage.getItem("birre") || "[]")

function generaCodice(){
  return "XA-" + Date.now()
}

function salva(){

  let codice = document.getElementById("barcode").value.trim()
  if(!codice){
    codice = generaCodice()
  }

  let nome = document.getElementById("nome").value
  let birrificio = document.getElementById("birrificio").value
  let formato = document.getElementById("formato").value
  let prezzo = document.getElementById("prezzo").value
  let gusto = document.getElementById("gusto").value

  let file = document.getElementById("img").files[0]

  if(!nome){
    alert("Nome obbligatorio")
    return
  }

  let reader = new FileReader()

  reader.onload = function(){
    let img = reader.result

    db.push({
      codice,
      nome,
      birrificio,
      formato,
      prezzo,
      gusto,
      img
    })

    localStorage.setItem("birre", JSON.stringify(db))
    render()
  }

  if(file){
    reader.readAsDataURL(file)
  } else {
    reader.onload()
  }
}

function render(){
  let html = ""
  db.forEach(b => {

    html += `
    <div class="card">
      ${b.img ? `<img src="${b.img}">` : ""}
      <h3>${b.nome}</h3>
      <p><b>Codice:</b> ${b.codice}</p>
      <p><b>Birrificio:</b> ${b.birrificio}</p>
      <p><b>Formato:</b> ${b.formato}</p>
      <p><b>Prezzo:</b> € ${b.prezzo}</p>
      <p>${b.gusto}</p>
    </div>
    `
  })

  document.getElementById("lista").innerHTML = html
}

render()
</script>

</body>
</html>
