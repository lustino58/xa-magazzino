<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XA Magazzino Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111111" />
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }
    h1 {
      margin-top: 0;
      font-size: 42px;
    }
    .card {
      background: #1a1f2b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border-radius: 10px;
      border: none;
      box-sizing: border-box;
      font-size: 18px;
    }
    input {
      background: #f3f3f3;
      color: #111;
    }
    button {
      background: #e7e7e7;
      color: #111;
      font-weight: bold;
    }
    .gold {
      background: #d7b56d;
    }
    #reader {
      margin-top: 10px;
      display: none;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .prodotto {
      background: #222938;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }
    .small {
      color: #b8b8b8;
      font-size: 14px;
      margin-top: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .danger {
      background: #c74a4a;
      color: white;
    }
    .ok {
      color: #9fe29f;
      font-size: 14px;
      margin-top: 6px;
    }
    .warn {
      color: #ffd27a;
      font-size: 14px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>XA Magazzino</h1>

  <div class="card">
    <input id="barcode" placeholder="Barcode" />
    <button class="gold" onclick="startScanner()">📷 Scanner</button>
    <div id="reader"></div>
    <div id="stato" class="small"></div>
  </div>

  <div class="card">
    <input id="nome" placeholder="Nome prodotto" />
    <input id="qty" type="number" placeholder="Quantità" />
    <div class="row">
      <button onclick="salva()">Salva prodotto</button>
      <button onclick="svuotaCampi()">Svuota campi</button>
    </div>
    <div id="messaggio"></div>
  </div>

  <div class="card">
    <h3>Magazzino</h3>
    <div id="lista"></div>
  </div>

  <script>
    let prodotti = JSON.parse(localStorage.getItem("prodotti_xa")) || [];
    let html5QrCode = null;
    let scannerAttivo = false;

    function salvaLocal() {
      localStorage.setItem("prodotti_xa", JSON.stringify(prodotti));
    }

    function mostra() {
      const lista = document.getElementById("lista");
      if (prodotti.length === 0) {
        lista.innerHTML = `<div class="small">Nessun prodotto salvato.</div>`;
        return;
      }

      let html = "";
      prodotti.forEach((p, i) => {
        html += `
          <div class="prodotto">
            <b>${escapeHtml(p.nome || "Senza nome")}</b><br>
            Barcode: ${escapeHtml(p.barcode || "-")}<br>
            Quantità: ${Number(p.qty || 0)}
            <div class="row" style="margin-top:8px;">
              <button onclick="carico(${i})">+1 Carico</button>
              <button onclick="scarico(${i})">-1 Scarico</button>
            </div>
          </div>
        `;
      });
      lista.innerHTML = html;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function svuotaCampi() {
      document.getElementById("barcode").value = "";
      document.getElementById("nome").value = "";
      document.getElementById("qty").value = "";
      document.getElementById("messaggio").innerHTML = "";
      document.getElementById("stato").innerText = "";
    }

    function trovaPerBarcode(barcode) {
      return prodotti.findIndex(p => String(p.barcode || "").trim() === String(barcode || "").trim());
    }

    function salva() {
      const barcode = document.getElementById("barcode").value.trim();
      const nome = document.getElementById("nome").value.trim();
      const qty = parseInt(document.getElementById("qty").value || "0", 10);
      const msg = document.getElementById("messaggio");

      if (!barcode) {
        msg.innerHTML = `<div class="warn">Inserisci o scansiona un barcode.</div>`;
        return;
      }

      if (!nome) {
        msg.innerHTML = `<div class="warn">Inserisci il nome prodotto.</div>`;
        return;
      }

      const idx = trovaPerBarcode(barcode);

      if (idx >= 0) {
        prodotti[idx].nome = nome;
        prodotti[idx].qty = Number(prodotti[idx].qty || 0) + Number(qty || 0);
        msg.innerHTML = `<div class="ok">Prodotto aggiornato. Quantità aumentata.</div>`;
      } else {
        prodotti.push({
          barcode,
          nome,
          qty: Number(qty || 0)
        });
        msg.innerHTML = `<div class="ok">Prodotto salvato nel magazzino.</div>`;
      }

      salvaLocal();
      mostra();
    }

    function carico(i) {
      prodotti[i].qty = Number(prodotti[i].qty || 0) + 1;
      salvaLocal();
      mostra();
    }

    function scarico(i) {
      prodotti[i].qty = Math.max(0, Number(prodotti[i].qty || 0) - 1);
      salvaLocal();
      mostra();
    }

    async function cercaProdottoOnline(barcode) {
      const stato = document.getElementById("stato");
      stato.innerText = "Cerco prodotto online...";

      try {
        const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`;
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.product) {
          const nome =
            data.product.product_name_it ||
            data.product.product_name ||
            data.product.generic_name_it ||
            data.product.generic_name ||
            "";

          if (nome) {
            document.getElementById("nome").value = nome;
            stato.innerText = "Prodotto trovato online.";
            return true;
          }
        }

        stato.innerText = "Prodotto non trovato online. Inseriscilo a mano.";
        return false;
      } catch (e) {
        stato.innerText = "Ricerca online non riuscita. Inserisci a mano.";
        return false;
      }
    }

    async function gestisciBarcodeLetto(barcode) {
      document.getElementById("barcode").value = barcode;

      const idx = trovaPerBarcode(barcode);
      const stato = document.getElementById("stato");

      if (idx >= 0) {
        document.getElementById("nome").value = prodotti[idx].nome || "";
        document.getElementById("qty").value = "1";
        stato.innerText = "Prodotto già presente nel tuo magazzino.";
        return;
      }

      document.getElementById("qty").value = "1";
      await cercaProdottoOnline(barcode);
    }

    async function startScanner() {
      const reader = document.getElementById("reader");
      const stato = document.getElementById("stato");

      if (scannerAttivo) {
        stato.innerText = "Scanner già attivo.";
        return;
      }

      reader.style.display = "block";
      stato.innerText = "Avvio fotocamera...";

      html5QrCode = new Html5Qrcode("reader");
      scannerAttivo = true;

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          async (decodedText) => {
            await stopScanner();
            await gestisciBarcodeLetto(decodedText);
          },
          () => {}
        );
        stato.innerText = "Inquadra il barcode.";
      } catch (err) {
        scannerAttivo = false;
        reader.style.display = "none";
        stato.innerText = "Fotocamera non disponibile.";
      }
    }

    async function stopScanner() {
      const reader = document.getElementById("reader");
      if (html5QrCode && scannerAttivo) {
        try {
          await html5QrCode.stop();
          await html5QrCode.clear();
        } catch (e) {}
      }
      scannerAttivo = false;
      reader.style.display = "none";
    }

    mostra();
  </script>
</body>
</html>
