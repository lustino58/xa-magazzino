<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XA Magazzino</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  background:#0f1115;
  color:white;
  font-family:Arial;
  padding:20px;
}
input,button{
  width:100%;
  padding:12px;
  margin:5px 0;
}
#reader{
  margin-top:10px;
}
</style>
</head>

<body>

<h2>XA Magazzino</h2>

<input id="barcode" placeholder="Barcode">

<button onclick="startScanner()">📷 Scanner</button>

<div id="reader"></div>

<script>
function startScanner(){
  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      document.getElementById("barcode").value = decodedText;
      html5QrCode.stop();
    }
  );
}
</script>>

</body>
</html>
