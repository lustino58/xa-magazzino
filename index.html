<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XA Magazzino APP</title>

<style>
:root{
  --bg:#0b0f14;
  --card:#161d27;
  --text:#ffffff;
  --muted:#9aa7b5;

  --green:#43c66d;
  --red:#e05b5b;
  --blue:#5aa4ff;
  --orange:#ffad3b;

  --neon:#ff3b3b; /* CAMBIA QUI COLORE */
}

/* NEON LATERALE */
body::before,
body::after{
  content:"";
  position:fixed;
  top:0;
  width:6px;
  height:100%;
  background:var(--neon);
  box-shadow:0 0 15px var(--neon),0 0 30px var(--neon);
  z-index:999;
}
body::before{left:0;}
body::after{right:0;}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial;
}

/* PAGINE */
.page{
  display:none;
  padding:16px;
  padding-bottom:90px;
}
.active{
  display:block;
}

/* CARD */
.card{
  background:var(--card);
  padding:14px;
  border-radius:16px;
  margin-bottom:12px;
}

/* GRID CATALOGO */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.item{
  background:var(--card);
  border-radius:16px;
  padding:10px;
  text-align:center;
}

.item img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:12px;
}

/* BOTTONI */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  margin-top:6px;
}

.green{background:var(--green);}
.red{background:var(--red);}
.blue{background:var(--blue);}
.orange{background:var(--orange);}

/* MENU */
.menu{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#111;
  border-top:1px solid #222;
}

.menu button{
  flex:1;
  background:none;
  color:white;
  font-size:12px;
}

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h2>Home</h2>
  <div class="card">Prodotti: 0</div>
  <div class="card">Scorte basse: 0</div>
</div>

<!-- CATALOGO -->
<div id="catalogo" class="page">
  <h2>Catalogo</h2>
  <div class="grid">

    <div class="item">
      <img src="https://images.unsplash.com/photo-beer1" />
      <div>IPA</div>
    </div>

    <div class="item">
      <img src="https://images.unsplash.com/photo-1527169402691-feff5539e52c" />
      <div>Lager</div>
    </div>

  </div>
</div>

<!-- MAGAZZINO -->
<div id="magazzino" class="page">
  <h2>Magazzino</h2>
  <div class="card">Lista prodotti...</div>
</div>

<!-- CASSA -->
<div id="cassa" class="page">
  <h2>Cassa</h2>
  <div class="card">Totale: €0</div>
</div>

<!-- STATS -->
<div id="stats" class="page">
  <h2>Statistiche</h2>
  <div class="card">Vendite...</div>
</div>

<!-- MENU -->
<div class="menu">
  <button onclick="show('home')">Home</button>
  <button onclick="show('catalogo')">Catalogo</button>
  <button onclick="show('magazzino')">Magazzino</button>
  <button onclick="show('cassa')">Cassa</button>
  <button onclick="show('stats')">Stats</button>
</div>

<script>
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
